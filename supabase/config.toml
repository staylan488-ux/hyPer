# Function-level config. whoop-oauth must accept the browser redirect from
# WHOOP's consent screen, which carries no Supabase JWT — auth happens in-code
# (JWT for action=start/disconnect, HMAC-signed state for the callback).
[functions.whoop-oauth]
verify_jwt = false

[functions.whoop-sync]
verify_jwt = true

[functions.food-lookup]
verify_jwt = true

# JWT identity is checked in-code with getUser; normal signed-in users are accepted.
# This supports current Supabase signing keys; no unauthenticated analysis is allowed.
[functions.analyze-food-trial]
verify_jwt = false

# Deletes the caller's own account. The JWT is checked in-code with getUser, as
# in analyze-food-trial, so current Supabase signing keys work.
[functions.delete-account]
verify_jwt = false
