# Publishes site/ (privacy policy, terms, support) to GitHub Pages.
# Pages must be set to "GitHub Actions" in the repository settings once.
# The job refuses to publish while a placeholder such as [SUPPORT EMAIL]
# or [SELLER NAME] is still in the pages.
name: Public site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse placeholders
        run: |
          if grep -rnE '\[(SUPPORT EMAIL|SELLER NAME)\]' site; then
            echo "::error::Fill in the placeholders above before publishing."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
